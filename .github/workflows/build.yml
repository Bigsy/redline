name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The frontend build/test tasks are wired to run non-interactively under CI=true.
  CI: 'true'

jobs:
  check:
    name: Check (Kotlin + frontend unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Gradle's frontendTest task runs vitest but not tsc; typecheck explicitly.
      - name: Typecheck frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck

      # Builds the frontend bundle into src/main/resources/web, then runs the platform tests.
      - name: Gradle check
        run: ./gradlew check

      - name: Build plugin distribution
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: redline-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/

  e2e:
    name: Sandbox enforcement (real Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The e2e specs load the built shell out of src/main/resources/web.
      - name: Build viewer bundle
        run: ./gradlew frontendBuild

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        working-directory: frontend
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # The plugin verifier downloads whole IDE builds, so it runs on demand and on release tags
  # rather than on every push.
  verify:
    name: Plugin verifier
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-report
          path: build/reports/pluginVerifier/
