name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-marketplace-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare next patch release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check publishing secrets
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          for name in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD PUBLISH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Test release preparation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare version and changelog
        id: version
        run: |
          version="$(python3 scripts/bump-release.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties CHANGELOG.md
          git commit -m "Release $RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$RELEASE_VERSION"

      # GITHUB_TOKEN pushes do not trigger push workflows. Explicit dispatch does,
      # and selecting the tag makes the existing verify/publish conditions true.
      - name: Run checks and publishing for the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh workflow run build.yml --ref "v$RELEASE_VERSION"
          echo "Release v$RELEASE_VERSION queued in the build workflow; check that run for publication status." >> "$GITHUB_STEP_SUMMARY"
