<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redline</title>
    <style>
      /* Shell chrome only — the reviewed document lives inside the sandboxed iframe and its CSS
         cannot reach out here (nor ours in; the redline styles are injected into the iframe). */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .redline-content {
        position: relative;
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .redline-frame {
        flex: 1;
        width: 100%;
        border: none;
        /* HTML documents retain their own canvas; the generated Markdown stylesheet themes its
           reviewed document through the iframe's documentElement. */
        background: #fff;
      }
      /* Overview ruler: one tick per change block, plotted at blockTop/docHeight. */
      .redline-minimap {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 14px;
        background: rgba(0, 0, 0, 0.06);
        border-left: 1px solid rgba(0, 0, 0, 0.12);
      }
      .redline-tick {
        position: absolute;
        left: 2px;
        right: 2px;
        min-height: 3px;
        border-radius: 1px;
        cursor: pointer;
      }
      .redline-tick.ins {
        background: #7ac47a;
      }
      .redline-tick.del {
        background: #d98c8c;
      }
      .redline-tick.mixed {
        background: linear-gradient(to bottom, #7ac47a 50%, #d98c8c 50%);
      }
      .redline-tick.current {
        outline: 2px solid #3574f0;
      }
      .redline-nav {
        position: absolute;
        top: 8px;
        right: 22px;
        display: flex;
        flex-direction: column;
        /* Right-aligned, so the 26px arrows keep hugging the minimap strip instead of being
           pushed left by the much wider mode control above them. */
        align-items: flex-end;
        gap: 4px;
      }
      .redline-nav-button {
        font: 12px system-ui, sans-serif;
        width: 26px;
        height: 26px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.92);
        cursor: pointer;
      }
      .redline-nav-button:hover {
        background: #e8f1fb;
      }
      /* "3 / 12" between the nav buttons. It needs the same pill as the buttons because this
         floats over the reviewed document, whose canvas may follow either IDE theme. */
      .redline-nav-count {
        font: 11px system-ui, sans-serif;
        min-width: 26px;
        padding: 2px 4px;
        box-sizing: border-box;
        text-align: center;
        border: 1px solid rgba(0, 0, 0, 0.25);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.92);
        color: #1a1a1a;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        user-select: none;
      }
      /* Original / Redline / Final, as one segmented control. */
      .redline-modes {
        display: flex;
      }
      .redline-mode-button {
        font: 11px system-ui, sans-serif;
        padding: 3px 5px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        border-right-width: 0;
        background: rgba(255, 255, 255, 0.92);
        color: #1a1a1a;
        cursor: pointer;
      }
      .redline-mode-button:first-child {
        border-radius: 4px 0 0 4px;
      }
      .redline-mode-button:last-child {
        border-radius: 0 4px 4px 0;
        border-right-width: 1px;
      }
      .redline-mode-button:hover {
        background: #e8f1fb;
      }
      .redline-mode-button[aria-pressed='true'] {
        background: #3574f0;
        border-color: #3574f0;
        color: #fff;
      }
      .redline-banner {
        font: 13px/1.5 system-ui, sans-serif;
        padding: 6px 12px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.2);
      }
      .redline-banner.info {
        background: #e8f1fb;
        color: #1a3e63;
      }
      .redline-banner.warning {
        background: #fdf2d0;
        color: #5f4a0e;
      }
      /* Cancel control inside the "Computing redline…" banner. */
      .redline-cancel {
        font: 12px system-ui, sans-serif;
        margin-left: 8px;
        padding: 1px 8px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.92);
        cursor: pointer;
      }
      .redline-cancel:hover {
        background: #fff;
      }
      /* Find bar. Sits on document.body, not in #app, so a re-render cannot replace it. */
      .redline-findbar {
        position: fixed;
        top: 10px;
        /* Left, not right: the minimap strip, the nav buttons and the mode control all live on
           the right edge, and a floating bar there swallows their clicks. */
        left: 12px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
        font: 13px system-ui, sans-serif;
      }
      /* display:flex above would otherwise beat the hidden attribute's display:none. */
      .redline-findbar[hidden] {
        display: none;
      }
      .redline-findbar-search {
        min-width: 190px;
        padding: 3px 7px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        border-radius: 4px;
        background: #fff;
        color: #1a1a1a;
        font: inherit;
        outline: none;
      }
      .redline-findbar-search:focus {
        border-color: #3574f0;
      }
      .redline-findbar button {
        padding: 3px 6px;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: #1a1a1a;
        font: inherit;
        cursor: pointer;
      }
      .redline-findbar button:hover {
        background: rgba(0, 0, 0, 0.09);
      }
      .redline-findbar-case[aria-pressed='true'] {
        background: #3574f0;
        color: #fff;
      }
      .redline-findbar-count {
        min-width: 58px;
        text-align: center;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        opacity: 0.75;
        user-select: none;
      }
      .redline-findbar-count.redline-findbar-no-results {
        color: #a4262c;
        opacity: 1;
      }
      .redline-error {
        font: 13px/1.5 system-ui, sans-serif;
        padding: 12px;
        color: #a4262c;
        white-space: pre-wrap;
      }
      /* Dark IDE theme — set via html[data-theme] from the viewer URL's theme parameter. The
         generated Markdown document follows the same value inside its sandbox. */
      html[data-theme='dark'] body {
        background: #2b2d30;
      }
      html[data-theme='dark'] .redline-minimap {
        background: rgba(255, 255, 255, 0.08);
        border-left-color: rgba(255, 255, 255, 0.16);
      }
      html[data-theme='dark'] .redline-tick.current {
        outline-color: #6ea8ff;
      }
      html[data-theme='dark'] .redline-nav-button {
        background: rgba(43, 45, 48, 0.92);
        border-color: rgba(255, 255, 255, 0.28);
        color: #dfe1e5;
      }
      html[data-theme='dark'] .redline-nav-button:hover {
        background: #3d4045;
      }
      html[data-theme='dark'] .redline-nav-count {
        background: rgba(43, 45, 48, 0.92);
        border-color: rgba(255, 255, 255, 0.28);
        color: #dfe1e5;
      }
      html[data-theme='dark'] .redline-mode-button {
        background: rgba(43, 45, 48, 0.92);
        border-color: rgba(255, 255, 255, 0.28);
        color: #dfe1e5;
      }
      html[data-theme='dark'] .redline-mode-button:hover {
        background: #3d4045;
      }
      html[data-theme='dark'] .redline-mode-button[aria-pressed='true'] {
        background: #3574f0;
        border-color: #3574f0;
        color: #fff;
      }
      html[data-theme='dark'] .redline-banner {
        border-bottom-color: rgba(255, 255, 255, 0.2);
      }
      html[data-theme='dark'] .redline-banner.info {
        background: #263549;
        color: #a8c7f0;
      }
      html[data-theme='dark'] .redline-banner.warning {
        background: #453a12;
        color: #f0d268;
      }
      html[data-theme='dark'] .redline-cancel {
        background: rgba(43, 45, 48, 0.92);
        border-color: rgba(255, 255, 255, 0.28);
        color: #dfe1e5;
      }
      html[data-theme='dark'] .redline-cancel:hover {
        background: #3d4045;
      }
      html[data-theme='dark'] .redline-findbar {
        background: #2b2d30;
        border-color: rgba(255, 255, 255, 0.28);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      html[data-theme='dark'] .redline-findbar-search {
        background: #1e1f22;
        border-color: rgba(255, 255, 255, 0.28);
        color: #dfe1e5;
      }
      html[data-theme='dark'] .redline-findbar button {
        color: #dfe1e5;
      }
      html[data-theme='dark'] .redline-findbar button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      html[data-theme='dark'] .redline-findbar-count.redline-findbar-no-results {
        color: #f28b82;
      }
      html[data-theme='dark'] .redline-error {
        color: #f28b82;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
